<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2F6F5E" />
  <title>Home Manager</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="role">
  <div class="auth">
    <header class="auth-top">
      <a class="brand" href="index.html">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg></span>
        <span>Home Manager</span>
      </a>
      <div data-lang-switch></div>
    </header>

    <main class="auth-main">
      <p class="role-hello" id="role-hello"></p>
      <h1 class="title" data-i18n="role.title">Who are you?</h1>
      <p class="lead" data-i18n="role.lead"></p>

      <div class="role-cards">
        <button type="button" class="role-card role-card-parent" data-role="parent">
          <span class="role-icon"><span data-icon="send"></span></span>
          <span>
            <strong class="role-title" data-i18n="role.parentTitle">I'm a parent</strong>
            <span class="role-text" data-i18n="role.parentText"></span>
          </span>
        </button>

        <button type="button" class="role-card role-card-child" data-role="child">
          <span class="role-icon"><span data-icon="bell"></span></span>
          <span>
            <strong class="role-title" data-i18n="role.childTitle">I'm a child</strong>
            <span class="role-text" data-i18n="role.childText"></span>
          </span>
        </button>
      </div>
    </main>
  </div>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
