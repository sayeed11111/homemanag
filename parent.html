<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2F6F5E" />
  <title>Home Manager</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div class="shell">
    <header class="topbar">
      <a href="index.html" class="brand" aria-label="Home Manager" data-i18n-aria="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg>
        </span>
      </a>
      <div class="topbar-who">
        <!-- .item-body = a column that may shrink, so a long family name gets an ellipsis -->
        <div class="item-body">
          <h1 class="topbar-title" data-family-name></h1>
          <div class="topbar-sub"><span data-conn></span><span data-conn-text></span></div>
        </div>
      </div>
      <div data-lang-switch></div>
    </header>

    <div class="offline-bar" data-offline-bar hidden data-i18n="conn.offline"></div>

    <main>
      <!-- ================= SEND ================= -->
      <section class="screen" data-screen="send">
        <button type="button" class="sound-banner" data-sound-banner hidden>
          <span data-icon="volume"></span><span data-i18n="snd.enable"></span>
        </button>

        <!-- New messages from the children (parent.js fills it) -->
        <div class="inbox" data-inbox hidden></div>

        <div>
          <div class="sec-head"><h2 class="sec-title" id="to-title" data-i18n="p.to"></h2></div>
          <div class="chips" data-chips role="group" aria-labelledby="to-title"></div>
          <div class="notice notice-gold" data-no-children hidden>
            <span data-icon="users"></span>
            <span data-i18n="p.noChildren"></span>
            <button type="button" class="btn btn-sm" data-go-family data-i18n="p.invite"></button>
          </div>
        </div>

        <div>
          <button type="button" class="urgent-toggle" data-urgent aria-pressed="false">
            <span data-icon="bolt"></span><span data-i18n="p.urgent"></span>
          </button>
        </div>

        <div>
          <div class="sec-head">
            <h2 class="sec-title" data-i18n="p.buttons"></h2>
            <button type="button" class="link-btn" data-edit-toggle></button>
          </div>
          <p class="sec-note" data-urgent-hint hidden data-i18n="p.urgentHint"></p>
          <p class="sec-note" data-edit-hint hidden data-i18n="p.editHint"></p>
          <div class="keys" data-keys></div>
          <button type="button" class="link-btn" data-restore hidden>
            <span data-icon="refresh"></span><span data-i18n="p.restore"></span>
          </button>
        </div>

        <form class="compose" data-compose novalidate autocomplete="off">
          <input class="input" type="text" maxlength="140" enterkeyhint="send" data-compose-input data-i18n-ph="p.ownPh" data-i18n-aria="p.ownPh" />
          <button type="submit" class="compose-send" data-compose-send data-i18n-aria="p.sendOwn" disabled><span data-icon="send"></span></button>
        </form>

        <div>
          <div class="sec-head">
            <h2 class="sec-title" data-i18n="p.recent"></h2>
            <button type="button" class="link-btn" data-show-all data-i18n="p.showAll"></button>
          </div>
          <div class="feed" data-latest></div>
        </div>
      </section>

      <!-- ================= HISTORY ================= -->
      <section class="screen" data-screen="history" hidden>
        <div>
          <div class="sec-head"><h2 class="sec-title" data-i18n="tab.history"></h2></div>
          <div class="feed" data-history></div>
        </div>
      </section>

      <!-- ================= FAMILY ================= -->
      <section class="screen" data-screen="family" hidden>
        <div>
          <div class="sec-head"><h2 class="sec-title" data-i18n="set.family"></h2></div>
          <div class="invite">
            <div class="code-box" data-code></div>
            <p class="hint" data-i18n="fam.inviteLead"></p>
            <div class="invite-actions">
              <button type="button" class="btn btn-primary" data-share><span data-icon="share"></span><span data-i18n="fam.share"></span></button>
              <button type="button" class="btn btn-outline" data-copy><span data-icon="copy"></span><span data-i18n="fam.copy"></span></button>
            </div>
          </div>
        </div>

        <div>
          <div class="sec-head"><h2 class="sec-title" data-i18n="set.members"></h2></div>
          <div class="rows" data-members></div>
        </div>

        <div class="rows">
          <div class="row">
            <span class="row-label" data-i18n="set.language"></span>
            <!-- Static on purpose: the switch is built once, in HMFlow.boot() -->
            <div data-lang-switch></div>
          </div>
          <div class="row">
            <span class="row-label"><span data-conn></span><span data-i18n="set.connection"></span></span>
            <span class="row-value" data-conn-text></span>
          </div>
          <div class="row">
            <span class="row-label" data-i18n="set.notifications"></span>
            <div class="row-value" data-notif></div>
          </div>
          <div class="row">
            <span class="row-label" data-i18n="set.sound"></span>
            <button type="button" class="btn btn-sm btn-outline" data-test-sound data-i18n="set.testSound"></button>
          </div>
        </div>

        <div class="notice">
          <span data-icon="home"></span><span data-i18n="set.install"></span>
        </div>

        <div class="foot-actions">
          <button type="button" class="btn btn-outline btn-block" data-logout><span data-icon="logout"></span><span data-i18n="set.logout"></span></button>
          <button type="button" class="btn btn-danger-quiet btn-block" data-leave data-i18n="set.leave"></button>
        </div>
      </section>
    </main>
  </div>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button type="button" class="tab is-active" data-tab="send" aria-current="page">
        <span data-icon="send"></span><span data-i18n="tab.send"></span>
      </button>
      <button type="button" class="tab" data-tab="history">
        <span data-icon="clock"></span><span data-i18n="tab.history"></span>
        <span class="tab-badge" data-badge hidden></span>
      </button>
      <button type="button" class="tab" data-tab="family">
        <span data-icon="users"></span><span data-i18n="tab.family"></span>
      </button>
    </div>
  </nav>

  <!-- ================= BUTTON EDITOR ================= -->
  <div class="sheet" id="editor" hidden role="dialog" aria-modal="true" aria-labelledby="editor-title">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 class="sheet-title" id="editor-title"></h2>
        <button type="button" class="sheet-close" data-sheet-close data-i18n-aria="set.cancel"><span data-icon="x"></span></button>
      </div>
      <form data-ed-form novalidate autocomplete="off">
        <div class="field" data-ed-field>
          <label for="ed-text" data-i18n="ed.text"></label>
          <input class="input" id="ed-text" type="text" maxlength="60" aria-describedby="ed-err" data-i18n-ph="ed.textPh" />
          <p class="err" id="ed-err" data-ed-err aria-live="polite"></p>
        </div>

        <p class="picker-label" id="ed-icon-label" data-i18n="ed.icon"></p>
        <div class="emoji-grid" role="radiogroup" aria-labelledby="ed-icon-label" data-ed-icons></div>

        <p class="picker-label" id="ed-color-label" data-i18n="ed.color"></p>
        <div class="swatches" role="radiogroup" aria-labelledby="ed-color-label" data-ed-colors></div>

        <div class="editor-preview" aria-hidden="true" data-ed-preview></div>

        <div class="foot-actions">
          <button type="submit" class="btn btn-primary btn-block" data-i18n="ed.save"></button>
          <button type="button" class="btn btn-danger-quiet btn-block" data-ed-remove hidden></button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bus.js"></script>
  <script src="js/family.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/parent.js"></script>
</body>
</html>
