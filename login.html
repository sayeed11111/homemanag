<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2F6F5E" />
  <title>Home Manager</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="login">
  <div class="auth">
    <header class="auth-top">
      <a class="brand" href="index.html">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg></span>
        <span>Home Manager</span>
      </a>
      <div data-lang-switch></div>
    </header>

    <main class="auth-main">
      <h1 class="title" data-i18n="login.title">Log in</h1>
      <p class="lead" id="login-lead" data-i18n="login.lead"></p>

      <form id="login-form" novalidate>
        <fieldset class="accounts" id="accounts">
          <legend class="sr-only" data-i18n="f.name"></legend>
        </fieldset>

        <div class="field">
          <label for="pin" data-i18n="f.pin"></label>
          <input class="input pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" />
        </div>

        <p class="form-error" id="login-error" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="login.submit">Log in</button>
      </form>

      <div class="quiet" id="login-empty" hidden>
        <span data-icon="user"></span>
        <p data-i18n="login.empty"></p>
        <a class="btn btn-primary btn-block" href="register.html" data-i18n="login.toReg">Create an account</a>
      </div>

      <p class="auth-alt" id="login-alt">
        <span data-i18n="login.new"></span>
        <a href="register.html" data-i18n="login.toReg">Create an account</a>
      </p>
    </main>
  </div>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
