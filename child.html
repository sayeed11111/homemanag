<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2F6F5E" />
  <title>Home Manager</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="is-child">

  <div class="shell">
    <header class="topbar">
      <a href="index.html" class="brand" aria-label="Home Manager" data-i18n-aria="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg>
        </span>
      </a>
      <div class="topbar-who">
        <!-- .item-body = a column that may shrink, so a long name gets an ellipsis -->
        <div class="item-body">
          <h1 class="topbar-title" data-name></h1>
          <div class="topbar-sub"><span data-conn></span><span data-conn-text></span></div>
        </div>
      </div>
      <div data-lang-switch></div>
    </header>

    <div class="offline-bar" data-offline-bar hidden data-i18n="conn.offline"></div>

    <main>
      <!-- ================= HOME ================= -->
      <section class="screen" data-screen="home">
        <button type="button" class="sound-banner" data-sound-banner hidden>
          <span data-icon="volume"></span><span data-i18n="snd.enable"></span>
        </button>

        <!-- child.js puts the instruction cards (or a "nothing new" block) here -->

        <div data-keys-block>
          <div class="sec-head"><h2 class="sec-title" data-i18n="c.toParents"></h2></div>
          <div class="keys keys-sm" data-keys></div>
        </div>
      </section>

      <!-- ================= HISTORY ================= -->
      <section class="screen" data-screen="history" hidden>
        <div class="feed" data-history></div>
      </section>

      <!-- ================= ME ================= -->
      <section class="screen" data-screen="me" hidden>
        <div class="rows"><div class="member" data-me-card></div></div>

        <div>
          <div class="sec-head">
            <h2 class="sec-title" data-i18n="set.family"></h2>
            <span class="row-value" data-family-name hidden></span>
          </div>
          <div class="invite">
            <p class="hint" data-i18n="set.code"></p>
            <div class="code-box" data-code></div>
            <div class="invite-actions">
              <button type="button" class="btn btn-outline" data-share><span data-icon="share"></span><span data-i18n="fam.share"></span></button>
              <button type="button" class="btn btn-outline" data-copy><span data-icon="copy"></span><span data-i18n="fam.copy"></span></button>
            </div>
          </div>
        </div>

        <div>
          <div class="sec-head"><h2 class="sec-title" data-i18n="set.members"></h2></div>
          <div class="rows" data-members></div>
        </div>

        <div class="rows">
          <div class="row">
            <span class="row-label" data-i18n="set.language"></span>
            <div data-lang-switch></div>
          </div>
          <div class="row">
            <span class="row-label" data-i18n="set.connection"></span>
            <span class="topbar-sub"><span data-conn></span><span data-conn-text></span></span>
          </div>
          <div class="row">
            <span class="row-label" data-i18n="set.notifications"></span>
            <div data-notif></div>
          </div>
          <div class="row">
            <span class="row-label" data-i18n="set.sound"></span>
            <button type="button" class="btn btn-sm btn-outline" data-test-sound data-i18n="set.testSound"></button>
          </div>
        </div>

        <p class="notice"><span data-icon="home"></span><span data-i18n="set.install"></span></p>

        <div class="foot-actions">
          <button type="button" class="btn btn-outline btn-block" data-logout><span data-icon="logout"></span><span data-i18n="set.logout"></span></button>
          <button type="button" class="btn btn-danger-quiet btn-block" data-leave data-i18n="set.leave"></button>
        </div>
      </section>
    </main>
  </div>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button type="button" class="tab" data-tab="home">
        <span data-icon="home"></span>
        <span data-i18n="tab.home"></span>
        <span class="tab-badge" data-badge hidden></span>
      </button>
      <button type="button" class="tab" data-tab="history">
        <span data-icon="clock"></span>
        <span data-i18n="tab.history"></span>
      </button>
      <button type="button" class="tab" data-tab="me">
        <span data-icon="user"></span>
        <span data-i18n="tab.me"></span>
      </button>
    </div>
  </nav>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bus.js"></script>
  <script src="js/family.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/child.js"></script>
</body>
</html>
